<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#1b1330"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8962e"/>
      <stop offset="0.5" stop-color="#f3e4a8"/>
      <stop offset="1" stop-color="#b8962e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <polygon points="0,630 260,330 420,470 640,250 820,420 1000,300 1200,520 1200,630" fill="#141a2b"/>
  <polygon points="0,630 200,420 380,540 560,380 760,520 960,400 1200,600 1200,630" fill="#0e1220"/>
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="url(#gold)" stroke-width="3" rx="6"/>
  <text x="600" y="240" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="84" fill="url(#gold)">Carry Me Back</text>
  <text x="600" y="320" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="56" fill="#ffffff">कैरी मी बैक · केदारनाथ</text>
  <text x="600" y="400" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" fill="#c8d1dc">Carry 1 kg down. Earn your Certificate of Appreciation.</text>
  <text x="600" y="500" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" font-size="34" fill="#4ade80">स्वच्छ केदारनाथ · सुंदर केदारनाथ</text>
</svg>
